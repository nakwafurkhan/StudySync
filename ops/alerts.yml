groups:
  - name: studysync
    rules:
      - alert: StudySyncUnavailable
        expr: up{job="studysync"} == 0 or studysync_database_ready == 0
        for: 30s
        labels: {severity: critical}
        annotations:
          summary: "API or MongoDB unavailable; follow docs/DEVOPS.md"
      - alert: StudySyncHighErrorRate
        expr: sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 0.001) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of API requests fail"
